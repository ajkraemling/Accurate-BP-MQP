; PlatformIO Project Configuration File

; ── Master: NodeMCU-32S (sensors + motor + LCD + I2C master to display) ───────
[env:nodemcu-32s]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Exclude the display-board sketch
build_src_filter = +<*> -<screen.cpp>

lib_deps =
  adafruit/Adafruit MPRLS Library
  Wire
  hd44780

; ── Slave: ESP32-2432S032C Display Board (ST7789 TFT + I2C slave) ─────────────
[env:display-board]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Only compile the display sketch
build_src_filter = -<*> +<screen.cpp>

lib_deps =
  Wire
  bodmer/TFT_eSPI

; TFT uses HSPI (pins hardwired on ESP32-2432S032C PCB)
; Inter-ESP32 I2C slave uses Wire (SDA=22, SCL=23)
build_flags =
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DUSE_HSPI_PORT
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MOSI=13
  -DTFT_MISO=-1
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=27
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=27000000
  -DSPI_READ_FREQUENCY=20000000
